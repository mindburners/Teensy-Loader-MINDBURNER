<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MINDBURNER MIDI MEDUSA II – Firmware Update</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      margin: 0;
      padding: 0;
      color: #e0e0e0;
    }
    .container {
      max-width: 580px;
      margin: 40px auto;
      background: #1e1e1e;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      padding: 28px 32px;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 1.6rem;
      font-weight: 600;
      color: #fff;
    }
    .subtitle {
      color: #aaa;
      margin-bottom: 28px;
      font-size: 0.95rem;
    }
    .step {
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid #333;
    }
    .step:last-child {
      border-bottom: none;
    }
    .step-number {
      display: inline-block;
      background: #ea7aaa;
      color: white;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      text-align: center;
      line-height: 26px;
      font-weight: 600;
      margin-right: 10px;
      font-size: 0.9rem;
    }
    .step-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
    }
    button {
      background: #ea7aaa;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      margin: 6px 8px 6px 0;
      transition: background 0.15s;
    }
    button:hover {
      background: #fa5687;
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    .progress-container {
      width: 100%;
      background: #333;
      border-radius: 8px;
      height: 28px;
      margin-top: 16px;
      overflow: hidden;
      position: relative;
    }
    #flashProgress {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ea7aaa, #ff6b9d);
      border-radius: 8px;
      transition: width 0.2s ease;
    }
    #progressText {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: white;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }
    #status {
      display: none;
      background: #2a2a2a;
      padding: 12px 16px;
      margin-top: 20px;
      border-radius: 6px;
      border-left: 4px solid #ea7aaa;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .note {
      font-size: 0.88rem;
      color: #999;
      margin-top: 8px;
    }
    input[type="file"] {
      margin-top: 10px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>MINDBURNER MIDI MEDUSA II</h1>
    <div class="subtitle">Firmware Updater</div>

    <!-- STEP 1 -->
    <div class="step">
      <div class="step-title">
        <span class="step-number">1</span>
        Load the Firmware
      </div>
      <button id="loadLatestBtn">Load Latest Firmware</button>
      <p class="note">This downloads the newest version automatically.</p>
      
      <p style="margin: 16px 0 6px; color:#888;">or choose a file yourself:</p>
      <input type="file" id="firmwareInput" accept=".hex,.ehex,.bin" />
    </div>

    <!-- STEP 2 -->
    <div class="step">
      <div class="step-title">
        <span class="step-number">2</span>
        Prepare the Device
      </div>
      <button id="resetBootloaderBtn">Prepare Device for Update</button>
      <p class="note">Click this first. Then continue to step 3.</p>
    </div>

    <!-- STEP 3 -->
    <div class="step">
      <div class="step-title">
        <span class="step-number">3</span>
        Update the Device
      </div>
      <button id="selectDeviceBtn">Select Device</button>
      <button id="uploadFirmwareBtn">Start Update</button>

      <div class="progress-container">
        <div id="flashProgress"></div>
        <div id="progressText">0%</div>
      </div>
    </div>

    <!-- Status -->
    <div id="status"></div>
  </div>

  <script type="module">
    import {
      FirmwareFile,
      TeensyFlasher,
      SerialPortManager,
      TEENSY_DEVICE_FILTERS
    } from './Teensy-Loader.js';

    let selectedDevice = null;
    let firmwareData = null;
    let firmwareName = null;

    const flasher = new TeensyFlasher();
    const serialManager = new SerialPortManager();

    const LATEST_FIRMWARE_URL = "https://raw.githubusercontent.com/mindburners/Teensy-Loader-MINDBURNER/main/FIRMWARE/MEDUSA_II_PRODUCTION.ino.hex";

    function setStatus(message) {
      const el = document.getElementById('status');
      if (!message) {
        el.style.display = 'none';
        el.textContent = '';
        return;
      }
      el.style.display = 'block';
      el.textContent = message;
      console.log(message);
    }

    function updateProgress(percent) {
      // percent comes as 0 → 1
      const value = Math.min(100, Math.round(percent * 100));
      document.getElementById('flashProgress').style.width = value + '%';
      document.getElementById('progressText').textContent = value + '%';
    }

    // STEP 1 – Load latest
    document.getElementById('loadLatestBtn').addEventListener('click', async () => {
      try {
        setStatus('Downloading latest firmware… please wait');
        const response = await fetch(LATEST_FIRMWARE_URL + '?t=' + Date.now());
        if (!response.ok) throw new Error('Download failed');

        const buffer = await response.arrayBuffer();
        firmwareData = new Uint8Array(buffer);
        firmwareName = 'MEDUSA_II_PRODUCTION.ino.hex';
        setStatus('Firmware ready! Continue to Step 2.');
      } catch (err) {
        setStatus('Could not download firmware. Please try again or choose a file manually.');
        console.error(err);
      }
    });

    // Manual file
    document.getElementById('firmwareInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        firmwareData = new Uint8Array(reader.result);
        firmwareName = file.name;
        setStatus('Firmware loaded: ' + firmwareName + ' — continue to Step 2.');
      };
      reader.readAsArrayBuffer(file);
    });

    // STEP 2 – Prepare (reboot to bootloader)
    document.getElementById('resetBootloaderBtn').addEventListener('click', async () => {
      try {
        setStatus('Please select your device in the popup…');
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });

        const writer = port.writable.getWriter();
        await writer.write(new TextEncoder().encode("REBOOT\n"));
        writer.releaseLock();
        await port.close();

        setStatus('Device is ready. Now go to Step 3 and click “Select Device”.');
      } catch (err) {
        setStatus('Could not prepare device. Make sure it is plugged in and try again.');
        console.error(err);
      }
    });

    // STEP 3 – Select device
    document.getElementById('selectDeviceBtn').addEventListener('click', async () => {
      try {
        setStatus('Select your device in the popup…');
        const devices = await navigator.hid.requestDevice({ filters: TEENSY_DEVICE_FILTERS });
        if (devices && devices.length > 0) {
          selectedDevice = devices[0];
          setStatus('Device selected! Now click “Start Update”.');
        } else {
          setStatus('No device was selected.');
        }
      } catch (err) {
        setStatus('Could not select device. Try again.');
        console.error(err);
      }
    });

    // STEP 3 – Upload
    document.getElementById('uploadFirmwareBtn').addEventListener('click', async () => {
      if (!firmwareData) {
        setStatus('Please load the firmware first (Step 1).');
        return;
      }
      if (!selectedDevice) {
        setStatus('Please select the device first (Step 3).');
        return;
      }

      let offset = 0x00000000;
      if (selectedDevice.productId === 0x0478 || selectedDevice.productId === 0x0479) {
        offset = 0x60000000;
      }

      try {
        setStatus('Updating… please wait. Do not unplug the device.');
        updateProgress(0);

        const fw = new FirmwareFile(firmwareData, firmwareName);
        const blocks = await fw.buildBlocks(offset);

        await flasher.flashFirmware(blocks, selectedDevice, (progress) => {
          updateProgress(progress);
        });

        updateProgress(1);
        setStatus('Update complete! Your device will restart automatically.');
      } catch (err) {
        setStatus('Update failed. Please try again or hold the button on the device and retry.');
        console.error(err);
      }
    });
  </script>
</body>
</html>
