<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MINDBURNER MIDI MEDUSA II – Firmware Update</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      margin: 0;
      padding: 0;
      color: #e0e0e0;
    }
    .container {
      max-width: 580px;
      margin: 40px auto;
      background: #1e1e1e;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      padding: 28px 32px;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 1.6rem;
      font-weight: 600;
      color: #fff;
    }
    .subtitle {
      color: #aaa;
      margin-bottom: 28px;
      font-size: 0.95rem;
    }
    .step {
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid #333;
    }
    .step:last-child {
      border-bottom: none;
    }
    .step-number {
      display: inline-block;
      background: #ea7aaa;
      color: white;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      text-align: center;
      line-height: 26px;
      font-weight: 600;
      margin-right: 10px;
      font-size: 0.9rem;
    }
    .step-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
    }
    button {
      background: #ea7aaa;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      margin: 6px 8px 6px 0;
      transition: background 0.15s;
    }
    button:hover {
      background: #fa5687;
    }
    .progress-container {
      width: 100%;
      background: #333;
      border-radius: 8px;
      height: 28px;
      margin-top: 16px;
      overflow: hidden;
      position: relative;
    }
    #flashProgress {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ea7aaa, #ff6b9d);
      border-radius: 8px;
      transition: width 0.2s ease;
    }
    #progressText {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: white;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }
    #status {
      display: none;
      background: #2a2a2a;
      padding: 12px 16px;
      margin-top: 20px;
      border-radius: 6px;
      border-left: 4px solid #ea7aaa;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .note {
      font-size: 0.88rem;
      color: #999;
      margin-top: 8px;
    }
    input[type="file"] {
      margin-top: 10px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>MINDBURNER MIDI MEDUSA II</h1>
    <div class="subtitle">Firmware Updater</div>

    <!-- STEP 1 -->
    <div class="step">
      <div class="step-title">
        <span class="step-number">1</span>
        Load the Firmware
      </div>
      <button id="loadLatestBtn">Load Latest Firmware</button>
      <p class="note">Downloads the newest version automatically.</p>
      
      <p style="margin: 16px 0 6px; color:#888;">or choose a file yourself:</p>
      <input type="file" id="firmwareInput" accept=".hex,.ehex,.bin" />
    </div>

    <!-- STEP 2 -->
    <div class="step">
      <div class="step-title">
        <span class="step-number">2</span>
        Prepare the Device
      </div>
      <button id="prepareBtn">Prepare Device</button>
      <p class="note">Click this, then choose your device in the popup.</p>
    </div>

    <!-- STEP 3 -->
    <div class="step">
      <div class="step-title">
        <span class="step-number">3</span>
        Update
      </div>
      <button id="updateBtn">Select Device & Start Update</button>
      <p class="note">Click this right after Step 2. Choose the device in the popup.</p>

      <div class="progress-container">
        <div id="flashProgress"></div>
        <div id="progressText">0%</div>
      </div>
    </div>

    <div id="status"></div>
  </div>

  <script type="module">
    import {
      FirmwareFile,
      TeensyFlasher,
      TEENSY_DEVICE_FILTERS
    } from './Teensy-Loader.js';

    let selectedDevice = null;
    let firmwareData = null;
    let firmwareName = null;
    const flasher = new TeensyFlasher();

    const LATEST_FIRMWARE_URL = "https://raw.githubusercontent.com/mindburners/Teensy-Loader-MINDBURNER/main/FIRMWARE/MEDUSA_II_PRODUCTION.ino.hex";

    function setStatus(msg) {
      const el = document.getElementById('status');
      if (!msg) {
        el.style.display = 'none';
        return;
      }
      el.style.display = 'block';
      el.textContent = msg;
      console.log(msg);
    }

    function updateProgress(p) {
      const value = Math.min(100, Math.round(p * 100));
      document.getElementById('flashProgress').style.width = value + '%';
      document.getElementById('progressText').textContent = value + '%';
    }

    // Step 1
    document.getElementById('loadLatestBtn').addEventListener('click', async () => {
      try {
        setStatus('Downloading latest firmware…');
        const res = await fetch(LATEST_FIRMWARE_URL + '?t=' + Date.now());
        if (!res.ok) throw new Error();
        firmwareData = new Uint8Array(await res.arrayBuffer());
        firmwareName = 'MEDUSA_II_PRODUCTION.ino.hex';
        setStatus('Firmware ready. Continue to Step 2.');
      } catch (e) {
        setStatus('Download failed. Try again or choose a file manually.');
      }
    });

    document.getElementById('firmwareInput').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        firmwareData = new Uint8Array(reader.result);
        firmwareName = file.name;
        setStatus('Firmware loaded. Continue to Step 2.');
      };
      reader.readAsArrayBuffer(file);
    });

    // Step 2 – only prepare
    document.getElementById('prepareBtn').addEventListener('click', async () => {
      try {
        setStatus('Select your device in the popup…');
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });
        const writer = port.writable.getWriter();
        await writer.write(new TextEncoder().encode("REBOOT\n"));
        writer.releaseLock();
        await port.close();
        setStatus('Device prepared. Now quickly click “Select Device & Start Update”.');
      } catch (e) {
        setStatus('Could not prepare device. Try again.');
      }
    });

    // Step 3 – select + update in one go
    document.getElementById('updateBtn').addEventListener('click', async () => {
      if (!firmwareData) {
        setStatus('Please load the firmware first (Step 1).');
        return;
      }

      try {
        setStatus('Select your device in the popup…');
        const devices = await navigator.hid.requestDevice({ filters: TEENSY_DEVICE_FILTERS });
        if (!devices || devices.length === 0) {
          setStatus('No device selected.');
          return;
        }
        selectedDevice = devices[0];

        // Start update immediately
        setStatus('Updating… do not unplug the device.');
        updateProgress(0);

        let offset = 0x00000000;
        if (selectedDevice.productId === 0x0478 || selectedDevice.productId === 0x0479) {
          offset = 0x60000000;
        }

        const fw = new FirmwareFile(firmwareData, firmwareName);
        const blocks = await fw.buildBlocks(offset);

        await flasher.flashFirmware(blocks, selectedDevice, (p) => {
          updateProgress(p);
        });

        updateProgress(1);
        setStatus('Update complete! The device will restart. You can unplug it.');
      } catch (e) {
        setStatus('Update failed. Try preparing the device again (Step 2) and retry.');
        console.error(e);
      }
    });
  </script>
</body>
</html>
